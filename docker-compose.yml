services:
  # 1. Redis 向量库
  redis:
    image: redis/redis-stack-server:latest
    container_name: saas-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: always

  # 2. 后端 FastAPI
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas-backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    user: root  # 解决数据库权限
    ports:
      - "8000:8000"
    environment:
      - API_BASE_URL=http://backend:8000
      - DB_URL=sqlite:////app/dev1.db  # 解决数据库路径
      - REDIS_URL=redis://redis:6379/0
      - CELERY_REDIS_URL=redis://redis:6379/1
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy   # 确保 Redis 健康后才启动
    volumes:
      - ./uploads:/app/uploads
    restart: always

  # 3. 前端 Streamlit (假设你用的是 8501 端口)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas-frontend
    command: streamlit run ui.py --server.port 8501 --server.address 0.0.0.0 --server.fileWatcherType none
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
      - STREAMLIT_SERVER_RUN_ON_SAVE=false
    env_file:
      - .env
    depends_on:
      - backend
    restart: always

  # 4. Celery 异步任务
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas-worker
    command: python -m celery -A core.RAG.celery_app.celery_app worker --loglevel=info
    environment:
      - PYTHONPATH=/app:/backend
      - DB_URL=sqlite:////app/dev1.db
      - REDIS_URL=redis://redis:6379/0           # 改回 0，向量库统一用 0
      - CELERY_REDIS_URL=redis://redis:6379/1
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: always

volumes:
  redis_data: