services:
  services:
    # 1. Redis 向量库
    redis:
      image: redis/redis-stack-server:latest
      container_name: saas-redis
      ports:
        - "6379:6379"
      volumes:
        - redis_data:/data

    # 2. 后端 FastAPI
    backend:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: saas-backend
      command: uvicorn main:app --host 0.0.0.0 --port 8000
      user: root  # 解决数据库权限
      ports:
        - "8000:8000"
      environment:
        - API_BASE_URL=http://backend:8000
        - DB_URL=sqlite:////app/dev1.db  # 解决数据库路径
      env_file:
        - .env
      depends_on:
        - redis
      volumes:
        - ./uploads:/app/uploads

    # 3. 前端 Streamlit (假设你用的是 8501 端口)
    frontend:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: saas-frontend
      command: streamlit run ui.py --server.port 8501 --server.address 0.0.0.0
      ports:
        - "8501:8501"
      env_file:
        - .env
      depends_on:
        - backend

    # 4. Celery 异步任务
    worker:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: saas-worker
      command: python -m celery -A core.RAG.celery_app.celery_app worker --loglevel=info
      environment:
        - REDIS_URL=redis://redis:6379
      env_file:
        - .env
      depends_on:
        - redis
        - backend

  volumes:
    redis_data: